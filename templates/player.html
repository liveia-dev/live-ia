<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Player IA da Live</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: sans-serif;
      color: #fff;
      font-size: 14px;
    }
    #texto {
      position: fixed;
      bottom: 10px;
      left: 10px;
      max-width: 90%;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="texto"></div>
  <audio id="player"></audio>

  <script>
    const audioEl = document.getElementById('player');
    const textoEl = document.getElementById('texto');
    let tocandoAgora = false;

    async function tocarProximo() {
      if (tocandoAgora) return;

      try {
        const res = await fetch('/next');
        const data = await res.json();

        if (data.empty) return;

        tocandoAgora = true;
        audioEl.src = '/static/audio/' + data.filename;
        textoEl.textContent = data.text || '';
        audioEl.play().catch(() => {
          tocandoAgora = false;
        });
      } catch (e) {
        // silencioso: tenta de novo no próximo ciclo
      }
    }

    audioEl.addEventListener('ended', () => {
      tocandoAgora = false;
      tocarProximo();
    });

    // checa a fila periodicamente, caso não tenha nada tocando no momento
    setInterval(tocarProximo, 1000);
  </script>
</body>
</html>
