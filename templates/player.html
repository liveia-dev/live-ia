<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Player IA da Live</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
      font-size: 14px;
    }
    #avatar-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #avatar-stage video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    #avatar-stage video.ativo {
      opacity: 1;
    }
    #texto {
      position: fixed;
      bottom: 10px;
      left: 10px;
      max-width: 90%;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 10;
    }
    #ativar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      font-size: 16px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <button id="ativar">🔊 Clique aqui pra ativar o áudio (só necessário testando no navegador)</button>

  <!-- VERSÃO LEVE: só 2 <video> no DOM (double buffer), em vez de 5 tocando sempre.
       O src de cada um é definido/limpo dinamicamente pelo JS, então só o clipe
       que está de fato em uso (ou em transição) fica carregado/decodificando. -->
  <div id="avatar-stage">
    <video id="layerA" muted loop playsinline preload="none"></video>
    <video id="layerB" muted loop playsinline preload="none"></video>
  </div>

  <div id="texto"></div>
  <audio id="player"></audio>

  <script>
    const CLIP_IDLE = 'avatar_idle';
    const TEMPO_CROSSFADE_MS = 500; // precisa bater com a "transition" do CSS acima

    const layers = [document.getElementById('layerA'), document.getElementById('layerB')];
    let indiceTopo = 0;   // qual dos 2 <video> está visível agora
    let clipAtual = null; // nome do clipe atualmente visível

    function urlDoClipe(nomeClip) {
      return '/static/video/' + nomeClip + '.mp4';
    }

    // Troca o clipe visível: carrega o novo vídeo no layer de baixo, espera ele
    // estar pronto pra tocar, faz o crossfade e SÓ ENTÃO descarrega o vídeo antigo
    // (pause + remove o src) pra não ficar consumindo CPU/memória à toa.
    function mostrarClipe(nomeClip) {
      const alvo = nomeClip || CLIP_IDLE;
      if (alvo === clipAtual) return;

      const indiceFundo = 1 - indiceTopo;
      const proximo = layers[indiceFundo];
      const anterior = layers[indiceTopo];

      const aoPoderTocar = () => {
        proximo.removeEventListener('canplay', aoPoderTocar);
        proximo.currentTime = 0;
        proximo.play().catch(() => {});
        proximo.classList.add('ativo');
        anterior.classList.remove('ativo');

        // libera o vídeo anterior um pouco depois do crossfade terminar,
        // exceto se o novo clipe já for o mesmo (evita descarregar à toa)
        setTimeout(() => {
          if (anterior !== proximo) {
            anterior.pause();
            anterior.removeAttribute('src');
            anterior.load(); // limpa o buffer decodificado
          }
        }, TEMPO_CROSSFADE_MS + 50);
      };

      proximo.addEventListener('canplay', aoPoderTocar);
      proximo.src = urlDoClipe(alvo);
      proximo.load();

      clipAtual = alvo;
      indiceTopo = indiceFundo;
    }

    const audioEl = document.getElementById('player');
    const textoEl = document.getElementById('texto');
    const botaoAtivar = document.getElementById('ativar');
    let tocandoAgora = false;
    let inicioTocando = null;

    async function tocarProximo() {
      if (tocandoAgora) return;

      try {
        const res = await fetch('/next');
        const data = await res.json();

        if (data.empty) return;

        tocandoAgora = true;
        inicioTocando = Date.now();

        mostrarClipe(data.avatar_clip || CLIP_IDLE);

        audioEl.src = '/static/audio/' + data.filename;
        textoEl.textContent = data.text || '';
        audioEl.play().catch(() => {
          tocandoAgora = false;
          mostrarClipe(CLIP_IDLE);
        });
      } catch (e) {
        // silencioso: tenta de novo no próximo ciclo
      }
    }

    botaoAtivar.addEventListener('click', () => {
      audioEl.play().catch(() => {});
      audioEl.pause();
      botaoAtivar.style.display = 'none';

      // carrega o idle pela primeira vez (nenhum vídeo carregado até aqui)
      mostrarClipe(CLIP_IDLE);
      tocarProximo();
    });

    audioEl.addEventListener('ended', () => {
      tocandoAgora = false;
      mostrarClipe(CLIP_IDLE); // volta sozinho pro idle quando a fala termina
      tocarProximo();
    });

    audioEl.addEventListener('error', () => {
      tocandoAgora = false;
      mostrarClipe(CLIP_IDLE);
      tocarProximo();
    });

    // trava de segurança + checagem periódica da fila
    setInterval(() => {
      if (tocandoAgora && inicioTocando && (Date.now() - inicioTocando > 15000)) {
        tocandoAgora = false;
        mostrarClipe(CLIP_IDLE);
      }
      tocarProximo();
    }, 1000);
  </script>
</body>
</html>
