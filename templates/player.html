<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Player IA da Live</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
      font-size: 14px;
    }
    #avatar-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #avatar-stage video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
    }
    /* camadas de conteúdo (idle / pergunta / presentes): troca quase instantânea,
       porque quem "esconde" a troca é a camada de transição por cima */
    #layerA, #layerB {
      transition: opacity 0.08s linear;
    }
    #layerA.ativo, #layerB.ativo {
      opacity: 1;
    }
    /* camada de transição: fica por cima de tudo, cobre a tela e revela o novo clipe */
    #transitionLayer {
      z-index: 5;
      transition: opacity 0.22s ease-in-out;
    }
    #transitionLayer.ativo {
      opacity: 1;
    }
    #texto {
      position: fixed;
      bottom: 10px;
      left: 10px;
      max-width: 90%;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 10;
    }
    #ativar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      font-size: 16px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <button id="ativar">🔊 Clique aqui pra ativar o áudio (só necessário testando no navegador)</button>

  <div id="avatar-stage">
    <video id="layerA" muted playsinline preload="none"></video>
    <video id="layerB" muted playsinline preload="none"></video>
    <!-- camada de transição: fica sempre pré-carregada (é pequena e usada em toda troca) -->
    <video id="transitionLayer" muted playsinline preload="auto"></video>
  </div>

  <div id="texto"></div>
  <audio id="player"></audio>

  <script>
    const CLIP_IDLE = 'avatar_idle';
    const CLIP_TRANSICAO = 'avatar_transicao_08s';

    // Vídeos hospedados como assets de uma GitHub Release (gratuito, sem cartão,
    // servido pela CDN da Fastly por trás do GitHub).
    function urlDoClipe(nomeClip) {
      return 'https://github.com/liveia-dev/live-ia/releases/download/v1/' + nomeClip + '.mp4';
    }

    // TEMPO_COBERTURA_MS: quanto tempo a transição fica 100% cobrindo a tela
    // antes de revelar o novo clipe por baixo. Calculado como ~55% da duração
    // real do avatar_transicao_08s.mp4 (0,81s no total).
    const TEMPO_COBERTURA_MS = 450;

    // Precisa bater com a duração do "transition: opacity" do #transitionLayer no CSS acima.
    const FADE_TRANSICAO_MS = 220;

    const layers = [document.getElementById('layerA'), document.getElementById('layerB')];
    const transitionEl = document.getElementById('transitionLayer');
    transitionEl.src = urlDoClipe(CLIP_TRANSICAO);
    transitionEl.load();

    let indiceTopo = 0;
    let clipAtual = null;
    let transicaoEmAndamento = false;

    function aguardarCanPlay(video) {
      return new Promise((resolve) => {
        if (video.readyState >= 3) return resolve();
        const onReady = () => {
          video.removeEventListener('canplay', onReady);
          resolve();
        };
        video.addEventListener('canplay', onReady);
      });
    }

    function esperar(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Primeira exibição (ao clicar em "ativar"): mostra o idle direto,
    // sem gastar a transição logo de cara — só faz sentido transicionar
    // DE um estado PRA outro, não na primeira vez que a tela liga.
    async function mostrarClipeInstantaneo(nomeClip) {
      const layer = layers[indiceTopo];
      layer.src = urlDoClipe(nomeClip);
      layer.load();
      await aguardarCanPlay(layer);
      layer.currentTime = 0;
      layer.play().catch(() => {});
      layer.classList.add('ativo');
      clipAtual = nomeClip;
    }

    // Troca "com moldura": cobre a tela com a transição, troca o clipe por
    // baixo enquanto está escondido, e revela o novo clipe já tocando.
    // Isso acontece tanto entrando num estado (idle -> presente) quanto
    // saindo dele de volta (presente -> idle) — a mesma transição sempre.
    async function mostrarClipe(nomeClip) {
      const alvo = nomeClip || CLIP_IDLE;
      if (alvo === clipAtual || transicaoEmAndamento) return;
      transicaoEmAndamento = true;

      const indiceFundo = 1 - indiceTopo;
      const proximo = layers[indiceFundo];
      const anterior = layers[indiceTopo];

      // 1. prepara o próximo clipe em segundo plano, ainda invisível
      proximo.src = urlDoClipe(alvo);
      proximo.load();
      await aguardarCanPlay(proximo);

      // 2. cobre a tela com a transição
      transitionEl.currentTime = 0;
      transitionEl.play().catch(() => {});
      transitionEl.classList.add('ativo');
      await esperar(TEMPO_COBERTURA_MS);

      // 3. troca por baixo, escondido pela transição (troca quase instantânea)
      proximo.currentTime = 0;
      proximo.play().catch(() => {});
      proximo.classList.add('ativo');
      anterior.classList.remove('ativo');

      // 4. revela o novo clipe tirando a transição de cima
      transitionEl.classList.remove('ativo');

      clipAtual = alvo;
      indiceTopo = indiceFundo;

      // 5. libera o clipe anterior (não é mais o mesmo layer usado agora)
      setTimeout(() => {
        if (anterior !== proximo) {
          anterior.pause();
          anterior.removeAttribute('src');
          anterior.load();
        }
        transicaoEmAndamento = false;
      }, FADE_TRANSICAO_MS + 50);
    }

    const audioEl = document.getElementById('player');
    const textoEl = document.getElementById('texto');
    const botaoAtivar = document.getElementById('ativar');
    let tocandoAgora = false;
    let inicioTocando = null;

    async function tocarProximo() {
      if (tocandoAgora) return;

      try {
        const res = await fetch('/next');
        const data = await res.json();

        if (data.empty) return;

        tocandoAgora = true;
        inicioTocando = Date.now();

        // espera a transição terminar de revelar o novo clipe antes de
        // começar a falar — o avatar "chega" visualmente antes de falar
        await mostrarClipe(data.avatar_clip || CLIP_IDLE);

        audioEl.src = '/static/audio/' + data.filename;
        textoEl.textContent = data.text || '';
        audioEl.play().catch(() => {
          tocandoAgora = false;
          mostrarClipe(CLIP_IDLE);
        });
      } catch (e) {
        // silencioso: tenta de novo no próximo ciclo
      }
    }

    botaoAtivar.addEventListener('click', async () => {
      audioEl.play().catch(() => {});
      audioEl.pause();
      botaoAtivar.style.display = 'none';

      await mostrarClipeInstantaneo(CLIP_IDLE);
      tocarProximo();
    });

    audioEl.addEventListener('ended', () => {
      tocandoAgora = false;
      mostrarClipe(CLIP_IDLE); // volta sozinho pro idle, com a mesma transição
      tocarProximo();
    });

    audioEl.addEventListener('error', () => {
      tocandoAgora = false;
      mostrarClipe(CLIP_IDLE);
      tocarProximo();
    });

    // trava de segurança + checagem periódica da fila
    setInterval(() => {
      if (tocandoAgora && inicioTocando && (Date.now() - inicioTocando > 15000)) {
        tocandoAgora = false;
        mostrarClipe(CLIP_IDLE);
      }
      tocarProximo();
    }, 1000);
  </script>
</body>
</html>
