<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ferramenta de Teste - Live IA</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 15px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; }
  #log { background: #f4f4f4; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>

<h1>🎛️ Ferramenta de Teste — Live IA</h1>
<p>Abra o player em outra aba antes de testar: <a href="https://live-ia.onrender.com/player" target="_blank">abrir player</a></p>

<div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin:12px 0;">
  <label>Pergunta pra testar:</label>
  <input id="textoPergunta" type="text" value="qual a capital do Japão?" style="width:100%; padding:8px; margin:8px 0; box-sizing:border-box;">
  <button onclick="perguntar()">❓ Enviar essa pergunta</button>
</div>

<div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin:12px 0;">
  <label>Nome do presente pra testar:</label>
  <input id="nomePresente" type="text" value="Rosa" style="width:100%; padding:8px; margin:8px 0; box-sizing:border-box;">
  <button onclick="mandarPresente()">🎁 Mandar esse presente</button>
  <p style="font-size:12px; color:#666;">Exemplos prontos pra testar os 3 níveis: <b>Rosa</b> (barato) · <b>Panda</b> (médio) · <b>Leão</b> (caro, usa IA mesmo em modo NPC)</p>
</div>

<button onclick="mandarVariosPresentes()">🎁🎁🎁 Mandar 10 rosas rápido (combo)</button>

<div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin:12px 0;">
  <label>🗣️ Falar algo agora (boas-vindas, avisos, etc — vai direto pra fila, sem passar pela IA):</label>
  <textarea id="textoFalar" rows="3" style="width:100%; padding:8px; margin:8px 0; box-sizing:border-box; font-family:inherit;">Sejam muito bem-vindos à live, pessoal!</textarea>
  <button onclick="falarAgora()">🗣️ Mandar pra fila</button>
</div>

<div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin:12px 0;">
  <label>🎙️ Testar voz (achar algo menos robótico):</label>

  <select id="vozSelect" style="width:100%; padding:8px; margin:8px 0; box-sizing:border-box;">
    <option value="pt-BR-AntonioNeural">pt-BR-AntonioNeural (voz atual)</option>
    <option value="pt-BR-FranciscaNeural">pt-BR-FranciscaNeural</option>
    <option value="pt-BR-ThalitaMultilingualNeural">pt-BR-ThalitaMultilingualNeural (mais nova/natural)</option>
    <option value="pt-BR-DonatoNeural">pt-BR-DonatoNeural</option>
    <option value="pt-BR-FabioNeural">pt-BR-FabioNeural</option>
    <option value="pt-BR-JulioNeural">pt-BR-JulioNeural</option>
    <option value="pt-BR-NicolauNeural">pt-BR-NicolauNeural</option>
    <option value="pt-BR-ValerioNeural">pt-BR-ValerioNeural</option>
    <option value="pt-BR-HumbertoNeural">pt-BR-HumbertoNeural</option>
    <option value="pt-BR-LeticiaNeural">pt-BR-LeticiaNeural</option>
    <option value="pt-BR-BrendaNeural">pt-BR-BrendaNeural</option>
    <option value="pt-BR-ElzaNeural">pt-BR-ElzaNeural</option>
    <option value="pt-BR-ManuelaNeural">pt-BR-ManuelaNeural</option>
    <option value="pt-BR-GiovannaNeural">pt-BR-GiovannaNeural</option>
    <option value="pt-BR-LeilaNeural">pt-BR-LeilaNeural</option>
    <option value="pt-BR-YaraNeural">pt-BR-YaraNeural</option>
  </select>

  <div style="display:flex; gap:8px;">
    <div style="flex:1;">
      <label style="font-size:12px; color:#666;">Pitch</label>
      <input id="vozPitch" type="text" value="+0Hz" style="width:100%; padding:8px; box-sizing:border-box;">
    </div>
    <div style="flex:1;">
      <label style="font-size:12px; color:#666;">Rate</label>
      <input id="vozRate" type="text" value="+0%" style="width:100%; padding:8px; box-sizing:border-box;">
    </div>
  </div>

  <label style="font-size:12px; color:#666; display:block; margin-top:8px;">Frase de teste</label>
  <input id="vozTexto" type="text"
         value="Oi gente, tudo bem com vocês? Que bom ter vocês aqui na live hoje, vamos bater um papo bem gostoso!"
         style="width:100%; padding:8px; margin:8px 0; box-sizing:border-box;">

  <button onclick="testarVoz()">▶️ Gerar e tocar essa voz</button>
  <audio id="playerVoz" controls style="width:100%; margin-top:8px; display:none;"></audio>
</div>

<div id="log">Aguardando...</div>

<script>
  const SERVIDOR = "https://live-ia.onrender.com";
  const logEl = document.getElementById('log');

  function log(msg) {
    logEl.textContent = new Date().toLocaleTimeString() + " - " + msg + "\n" + logEl.textContent;
  }

  async function perguntar() {
    const pergunta = document.getElementById('textoPergunta').value.trim() || "qual a capital do Japão?";
    log("Enviando pergunta: " + pergunta + "...");
    try {
      const res = await fetch(SERVIDOR + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value1: "testeuser", value2: pergunta })
      });
      const data = await res.json();
      log("Resposta: " + JSON.stringify(data));
    } catch (e) {
      log("Erro: " + e);
    }
  }

  async function mandarPresente() {
    const nome = document.getElementById('nomePresente').value.trim() || "Rosa";
    log("Enviando presente: " + nome + "...");
    try {
      const res = await fetch(SERVIDOR + "/gift", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value1: "testeuser", value3: nome })
      });
      const data = await res.json();
      log("Resposta: " + JSON.stringify(data));
    } catch (e) {
      log("Erro: " + e);
    }
  }

  async function falarAgora() {
    const texto = document.getElementById('textoFalar').value.trim();
    if (!texto) {
      log("Digite algum texto antes de mandar.");
      return;
    }
    log("Enviando pra fala: " + texto + "...");
    try {
      const res = await fetch(SERVIDOR + "/falar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: texto })
      });
      const data = await res.json();
      log("Resposta: " + JSON.stringify(data));
    } catch (e) {
      log("Erro: " + e);
    }
  }

  async function testarVoz() {
    const voice = document.getElementById('vozSelect').value;
    const pitch = document.getElementById('vozPitch').value.trim() || "+0Hz";
    const rate = document.getElementById('vozRate').value.trim() || "+0%";
    const texto = document.getElementById('vozTexto').value.trim() ||
      "Oi gente, tudo bem com vocês?";
    const playerVoz = document.getElementById('playerVoz');

    log(`Gerando voz: ${voice} (pitch ${pitch}, rate ${rate})...`);
    try {
      const params = new URLSearchParams({ voice, pitch, rate, texto, formato: "json" });
      const res = await fetch(SERVIDOR + "/testar-voz?" + params.toString());
      const data = await res.json();

      playerVoz.src = data.audio_url;
      playerVoz.style.display = "block";
      playerVoz.play().catch(() => {});

      log(`Pronto: ${voice} | pitch ${pitch} | rate ${rate}`);
    } catch (e) {
      log("Erro ao testar voz: " + e);
    }
  }

  async function mandarVariosPresentes() {
    log("Enviando 10 rosas rapidinho...");
    for (let i = 0; i < 10; i++) {
      fetch(SERVIDOR + "/gift", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value1: "testeuser", value3: "Rosa" })
      })
        .then(r => r.json())
        .then(data => log("Rosa " + (i + 1) + ": " + JSON.stringify(data)))
        .catch(e => log("Erro na rosa " + (i + 1) + ": " + e));
    }
  }
</script>

</body>
</html>
