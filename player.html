<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Player IA da Live</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: sans-serif;
      color: #fff;
      font-size: 14px;
    }
    #texto {
      position: fixed;
      bottom: 10px;
      left: 10px;
      max-width: 90%;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="texto"></div>
  <audio id="player"></audio>

  <script>
    let lastId = 0;
    const audioEl = document.getElementById('player');
    const textoEl = document.getElementById('texto');

    async function checarNovaResposta() {
      try {
        const res = await fetch('/latest');
        const data = await res.json();

        if (data.id && data.id !== lastId && data.filename) {
          lastId = data.id;
          audioEl.src = '/static/audio/' + data.filename;
          audioEl.play().catch(() => {});
          textoEl.textContent = data.text || '';
        }
      } catch (e) {
        // silencioso: só tenta de novo no próximo ciclo
      }
    }

    setInterval(checarNovaResposta, 2000);
  </script>
</body>
</html>
